<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Receiver Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>
        <div class="text-sm mb-4">
          Progress: {{Object.keys(decoded_chunks).length}} /
          {{file_metadata.chunks || 0}}
        </div>
        <button
          v-if="!is_receiving"
          v-on:click="start_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Receiver
        </button>
        <button
          v-else
          v-on:click="stop_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Receiver
        </button>
        <video id="videoElement" v-show="!is_showing" muted autoplay playsinline></video>
        <div id="qrcode" v-show="is_showing"></div>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const { createApp, ref, reactive, onMounted, computed } = Vue;

      createApp({
        setup() {
          const user_message = ref("Click receive button to start receiving");
          const decoded_chunks = ref({});
          const file_metadata = reactive({});
          const is_receiving = ref(false);
          const is_showing = ref(false);
          let canvas, context, videoElement, qrcode_object;

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          const decode_data = (input_string) => {
            const encoded_data = atob(input_string.split(",")[1]);
            const encoded_array = Array.from(encoded_data, (char) =>
              char.charCodeAt(0)
            );
            const utf8Decoder = new TextDecoder();
            const output_string = utf8Decoder.decode(
              new Uint8Array(encoded_array)
            );
            const data_array = Array.from(output_string, (char) =>
              char.charCodeAt(0)
            );
            return {
              index: parseInt(input_string.split(",")[0]),
              data: data_array,
            };
          };

          const missing_to_hex = (missing_indices, total) => {
            let bytes = new Uint8Array(Math.ceil(total / 8));
            missing_indices.forEach((i) => {
              bytes[i >> 3] |= 1 << (i & 7);
            });
            return Array.from(bytes)
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          };

          const show_qr = (text) => {
            is_showing.value = true;
            qrcode_object.clear();
            qrcode_object.makeCode(text);
          };

          const download_file = (data, fileName) => {
            const blob = new Blob([data]);
            const dummy_element = document.createElement("a");
            const url = URL.createObjectURL(blob);
            dummy_element.href = url;
            dummy_element.download = fileName;
            dummy_element.click();
            URL.revokeObjectURL(url);
          };

          const stop_receiver = () => {
            is_receiving.value = false;
            is_showing.value = false;
            decoded_chunks.value = {};
            Object.assign(file_metadata, {});
            user_message.value = "Click receive button to start receiving";
          };

          // Scans until it decodes a chunk frame ("index,base64"), a
          // {type:"meta",...} frame, or a {type:"end_pass"} frame.
          // Returns the parsed frame/result, or {type:"aborted"}.
          const listen_for_pass = async () => {
            is_showing.value = false;
            while (is_receiving.value) {
              try {
                await sleep(10);
                context.drawImage(videoElement, 0, 0);
                let image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                let symbols = await zbarWasm.scanImageData(image_data);
                if (!symbols || !symbols.length) continue;
                let decoded_data = symbols[0].decode();
                if (!decoded_data.startsWith("{")) {
                  let raw_data = decode_data(decoded_data);
                  decoded_chunks.value[raw_data["index"]] = raw_data["data"];
                  user_message.value = `Received ${Object.keys(decoded_chunks.value).length}/${file_metadata.chunks || "?"} chunks ...`;
                  continue;
                }
                let frame;
                try {
                  frame = JSON.parse(decoded_data);
                } catch (error) {
                  continue;
                }
                if (frame.type === "meta") {
                  Object.assign(file_metadata, {
                    name: frame.name,
                    chunks: frame.chunks,
                  });
                  user_message.value = `Transferring file: ${file_metadata.name}`;
                } else if (frame.type === "end_pass") {
                  return frame;
                }
              } catch (error) {
                console.error("Error in Loop: ", error);
              }
            }
            return { type: "aborted" };
          };

          const start_receiver = async () => {
            decoded_chunks.value = {};
            Object.assign(file_metadata, {});
            is_receiving.value = true;

            while (is_receiving.value) {
              let end = await listen_for_pass();
              if (!is_receiving.value || end.type === "aborted") break;
              if (!file_metadata.chunks) continue; // haven't seen metadata yet

              let missing = [];
              for (let i = 0; i < file_metadata.chunks; i++) {
                if (!(i in decoded_chunks.value)) missing.push(i);
              }

              if (missing.length === 0) {
                user_message.value = "Data Transfer Complete";
                let output_array = [];
                for (let i = 0; i < file_metadata.chunks; i++) {
                  output_array = output_array.concat(decoded_chunks.value[i]);
                }
                let inflated_array = pako.inflate(Uint8Array.from(output_array));
                download_file(inflated_array, file_metadata.name);
                show_qr(JSON.stringify({ type: "done" }));
                await sleep(2000);
                break;
              } else {
                let bitmap = missing_to_hex(missing, file_metadata.chunks);
                show_qr(JSON.stringify({ type: "missing", bitmap }));
                user_message.value = `Missing ${missing.length} chunk(s). Point this device's camera at the sender's screen ...`;
                await sleep(1500);
              }
            }
            stop_receiver();
          };

          onMounted(async () => {
            console.log("Application Initialized ...");
            videoElement = document.getElementById("videoElement");
            videoElement.srcObject = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            canvas = document.createElement("canvas");
            context = canvas.getContext("2d");
            await new Promise((r) => setTimeout(r, 2000));
            canvas.height = videoElement.videoHeight;
            canvas.width = videoElement.videoWidth;
            context.drawImage(videoElement, 0, 0);

            let lowest_size =
              Math.min(window.innerWidth, window.innerHeight) / 1.5;
            qrcode_object = new QRCode("qrcode", {
              text: "",
              width: lowest_size,
              height: lowest_size,
              typeNumber: 40,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M,
            });
          });

          return {
            user_message,
            start_receiver,
            is_receiving,
            is_showing,
            file_metadata,
            decoded_chunks,
            stop_receiver,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
