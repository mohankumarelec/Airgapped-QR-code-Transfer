<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Sender Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>

        <div v-if="phase === 'idle'" class="w-1/2 mb-4">
          <input
            class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none"
            id="file_input"
            type="file"
          />
        </div>

        <button
          v-if="phase === 'idle'"
          v-on:click="start_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Transfer
        </button>

        <div v-if="phase === 'pass_done'" class="flex gap-4 mb-6">
          <button v-on:click="start_camera" class="p-1 border-2 border-gray-500">
            Start Camera
          </button>
          <button v-on:click="restart_transfer" class="p-1 border-2 border-gray-500">
            Restart
          </button>
        </div>

        <div v-if="phase === 'camera_scanning'" class="flex flex-col items-center gap-2 mb-6">
          <div v-if="report_progress" class="text-sm">{{report_progress}}</div>
          <button v-on:click="stop_camera_scan" class="p-1 border-2 border-gray-500">
            Cancel Scan
          </button>
        </div>

        <div v-if="phase === 'ready_to_resend'" class="mb-6">
          <button v-on:click="run_pass" class="p-1 border-2 border-gray-500">
            Start Showing QR Again
          </button>
        </div>

        <div v-if="camera_error" class="w-1/2 mb-6 p-4 border-2 border-red-500 bg-red-50">
          <div class="text-sm text-red-700 mb-3">{{camera_error}}</div>
          <div class="flex gap-4">
            <button v-on:click="start_camera" class="p-1 border-2 border-gray-500">
              Retry
            </button>
            <button v-on:click="dismiss_camera_error" class="p-1 border-2 border-gray-500">
              Back
            </button>
          </div>
        </div>

        <button
          v-if="phase !== 'idle' && phase !== 'complete'"
          v-on:click="cancel_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Cancel Transfer
        </button>
        <button
          v-if="phase === 'complete'"
          v-on:click="cancel_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start New Transfer
        </button>

        <div id="qrcode" v-show="qr_visible"></div>
        <video id="videoElement" v-show="phase === 'camera_scanning'" muted autoplay playsinline></video>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const user_message = ref("Choose file to get started");
          const phase = ref("idle"); // idle | sending | pass_done | camera_scanning | ready_to_resend | complete
          const camera_error = ref(null);
          const chunk_size = 250;
          let qrcode_object = "";
          const report_progress = ref("");
          const qr_visible = ref(true);
          let videoElement, canvas, context, media_stream;
          let chunks, total_chunks, file_name, missing_indices;
          let scan_abort = false;
          let report_parts = {};
          let report_total_parts = 0;

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          // Base64 the raw bytes directly. An earlier version round-tripped
          // through TextEncoder, which expanded every byte >= 0x80 into two
          // UTF-8 bytes and inflated the payload ~1.48x for no benefit --
          // denser QR codes and nothing gained.
          const encode_data = (index, input_bytes) => {
            let binary = "";
            for (let i = 0; i < input_bytes.length; i++) {
              binary += String.fromCharCode(input_bytes[i]);
            }
            return index + "," + btoa(binary);
          };

          const show_qr = (text) => {
            qr_visible.value = true;
            qrcode_object.clear();
            qrcode_object.makeCode(text);
          };

          // Wipe the QR off screen. Critical after a pass: a lingering
          // end_pass code would be re-scanned by the receiver and end its
          // next pass instantly, before any chunk is sent.
          const hide_qr = () => {
            qr_visible.value = false;
            qrcode_object.clear();
          };

          const hex_to_missing_indices = (hex, total) => {
            let bytes = hex.match(/.{1,2}/g).map((h) => parseInt(h, 16));
            let missing = [];
            for (let i = 0; i < total; i++) {
              if (bytes[i >> 3] & (1 << (i & 7))) missing.push(i);
            }
            return missing;
          };

          // Chrome/Android exposes non-standard focusMode control; keeps the
          // camera continuously focused on the QR code instead of hunting.
          const apply_continuous_focus = (stream) => {
            let track = stream.getVideoTracks()[0];
            if (!track || !track.getCapabilities) return;
            let capabilities = track.getCapabilities();
            if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
              track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
            }
          };

          const describe_camera_error = (error) => {
            switch (error.name) {
              case "NotAllowedError":
                return "Camera access was denied. Allow camera permission for this page in your browser settings, then retry.";
              case "NotFoundError":
                return "No camera was found on this device.";
              case "NotReadableError":
                return "The camera is in use by another app, or a hardware error occurred.";
              case "OverconstrainedError":
                return "No camera on this device satisfies the requested settings.";
              default:
                return `Could not access the camera: ${error.message || error.name}`;
            }
          };

          const wait_for_video_ready = (video) =>
            new Promise((resolve) => {
              if (video.videoWidth) resolve();
              else video.addEventListener("loadedmetadata", () => resolve(), { once: true });
            });

          const stop_camera_stream = () => {
            if (media_stream) {
              media_stream.getTracks().forEach((t) => t.stop());
              media_stream = null;
            }
          };

          const stop_camera_scan = () => {
            scan_abort = true;
            stop_camera_stream();
            show_qr(JSON.stringify({ type: "end_pass" }));
            phase.value = "pass_done";
            user_message.value = "Scan cancelled. Choose an action below.";
          };

          const dismiss_camera_error = () => {
            camera_error.value = null;
            show_qr(JSON.stringify({ type: "end_pass" }));
            phase.value = "pass_done";
          };

          const scan_loop = async () => {
            while (!scan_abort) {
              await sleep(10);
              try {
                context.drawImage(videoElement, 0, 0);
                let image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                let symbols = await zbarWasm.scanImageData(image_data);
                if (!symbols || !symbols.length) continue;
                let decoded_data = symbols[0].decode();
                if (!decoded_data.startsWith("{")) continue; // chunk frame, not for us
                let frame;
                try {
                  frame = JSON.parse(decoded_data);
                } catch (error) {
                  continue;
                }
                if (frame.type === "missing") {
                  report_parts[frame.part] = frame.bitmap;
                  report_total_parts = frame.parts;
                  let have = Object.keys(report_parts).length;
                  report_progress.value = `Report part ${have}/${report_total_parts} captured`;
                  if (have < report_total_parts) continue;
                  stop_camera_stream();
                  let full_bitmap = "";
                  for (let p = 0; p < report_total_parts; p++) {
                    full_bitmap += report_parts[p];
                  }
                  missing_indices = new Set(
                    hex_to_missing_indices(full_bitmap, total_chunks)
                  );
                  report_progress.value = "";
                  user_message.value = `Captured ${missing_indices.size} missing chunk(s). Ready to resend.`;
                  phase.value = "ready_to_resend";
                  return;
                } else if (frame.type === "done") {
                  stop_camera_stream();
                  user_message.value = "Transfer complete!";
                  phase.value = "complete";
                  return;
                }
              } catch (error) {
                console.error("Error in scan loop: ", error);
              }
            }
          };

          const start_camera = async () => {
            hide_qr();
            camera_error.value = null;
            report_parts = {};
            report_total_parts = 0;
            report_progress.value = "";
            phase.value = "camera_scanning";
            user_message.value = "Point this device's camera at the receiver's screen ...";
            try {
              media_stream = await navigator.mediaDevices.getUserMedia({
                video: {
                  facingMode: "environment",
                  width: { ideal: 1280 },
                  height: { ideal: 720 },
                  advanced: [{ focusMode: "continuous" }],
                },
              });
            } catch (error) {
              camera_error.value = describe_camera_error(error);
              phase.value = "pass_done";
              return;
            }
            apply_continuous_focus(media_stream);
            videoElement = document.getElementById("videoElement");
            videoElement.srcObject = media_stream;
            canvas = document.createElement("canvas");
            context = canvas.getContext("2d");
            await wait_for_video_ready(videoElement);
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            scan_abort = false;
            scan_loop();
          };

          const run_pass = async () => {
            phase.value = "sending";
            show_qr(JSON.stringify({ type: "meta", name: file_name, chunks: total_chunks }));
            user_message.value = "Sending metadata...";
            await sleep(1000);

            let ordered_missing = Array.from(missing_indices).sort((a, b) => a - b);
            for (let n = 0; n < ordered_missing.length; n++) {
              if (phase.value !== "sending") return; // cancelled
              let idx = ordered_missing[n];
              show_qr(encode_data(idx, chunks[idx]));
              user_message.value = `Sending chunk ${n + 1}/${ordered_missing.length} ...`;
              await sleep(50);
            }
            if (phase.value !== "sending") return;

            show_qr(JSON.stringify({ type: "end_pass" }));
            user_message.value = "Pass complete. Choose an action below.";
            phase.value = "pass_done";
          };

          const start_transfer = async () => {
            let file_input = document.getElementById("file_input");
            let file = file_input.files[0];
            if (!file) return;
            let data_array = pako.gzip(await file.arrayBuffer(), { level: 9 });
            total_chunks = Math.ceil(data_array.length / chunk_size);
            chunks = [];
            for (let i = 0; i < total_chunks; i++) {
              let start = i * chunk_size;
              chunks.push(data_array.subarray(start, start + chunk_size));
            }
            file_name = file.name;
            missing_indices = new Set(chunks.map((_, i) => i));
            await run_pass();
          };

          const restart_transfer = async () => {
            hide_qr();
            missing_indices = new Set(chunks.map((_, i) => i));
            await run_pass();
          };

          const cancel_transfer = () => {
            scan_abort = true;
            stop_camera_stream();
            camera_error.value = null;
            phase.value = "idle";
            user_message.value = "Choose file to get started";
            show_qr("Choose file to get started");
          };

          onMounted(() => {
            console.log("Application Initialized ...");
            let lowest_size =
              Math.min(window.innerWidth, window.innerHeight) / 1.5;
            qrcode_object = new QRCode("qrcode", {
              text: "Choose file to get started",
              width: lowest_size,
              height: lowest_size,
              typeNumber: 40,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M,
            });
          });

          return {
            user_message,
            phase,
            camera_error,
            report_progress,
            qr_visible,
            start_transfer,
            restart_transfer,
            start_camera,
            stop_camera_scan,
            dismiss_camera_error,
            run_pass,
            cancel_transfer,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
